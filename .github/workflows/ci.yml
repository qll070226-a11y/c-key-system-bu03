name: CI

on:
  push:
    branches: [main, pdoa-one-euro]
  pull_request:

permissions:
  contents: read

jobs:
  core-tests:
    name: C core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run tests
        run: bash tests/run_host_tests.sh

  host-tests:
    name: Python host tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
